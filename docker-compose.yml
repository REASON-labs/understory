services:
  understory:
    build: .
    ports:
      - "3800:3800"
    # Lets the container reach a llama.cpp server running on the host via
    # http://host.docker.internal:8080/v1 (see "Local llama.cpp" in the README).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Set BUNDLE_PATH in .env (gitignored) to your real bundle; defaults to the sample.
      - ${BUNDLE_PATH:-./sample-bundle}:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-}
      # Profiles (several isolated memories, one API key each): mount a volume
      # at /profiles and uncomment. See "Profiles" in the README.
      #PROFILES_ROOT: /profiles
      #ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Primary model
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      LLM_FALLBACK_RETRY_429: ${LLM_FALLBACK_RETRY_429:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-true}
      # Documented in .env.example but previously not forwarded, so setting them
      # in .env had no effect in the container. Empty means "use the default".
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      MUTATION_ROLLBACK: ${MUTATION_ROLLBACK:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      QUERY_CACHE: ${QUERY_CACHE:-}
      QUERY_CACHE_TTL: ${QUERY_CACHE_TTL:-}
      HOT_MEMORY: ${HOT_MEMORY:-}
      HOT_MEMORY_TTL: ${HOT_MEMORY_TTL:-}
      # DREAM_INTERVAL / DREAM_SIGNALS / DREAM_MAX_CHANGES are intentionally not forwarded here:
      # dreaming spends tokens unattended. To enable it without editing this
      # tracked file (which would conflict on the next git pull), put them in a
      # docker-compose.override.yml next to it; compose merges that automatically.
    restart: unless-stopped
