name: CI

# Test-only. Deliberately separate from docker.yml, whose publish job pushes a
# container image: this one can run on every branch and PR without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      # The test scripts are not covered by unit tests; at least keep them parseable.
      - run: for f in scripts/*.mjs; do node --check "$f"; done

  # The image is how this is deployed (`docker compose up --build`). Publishing is
  # tag-only, so without this a broken Dockerfile or lockfile would first show up
  # on the server. Build only: nothing is pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
