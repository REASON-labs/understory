# Portainer stack — pulls the prebuilt image from GHCR (no build step).
# Point Portainer at this file (Stacks → Add stack → Repository) and set
# the LLM env vars in the stack's environment variables UI.
#
# The image is this fork's, published only when a v* tag is pushed (see
# .github/workflows/docker.yml), so :latest is the newest release, not main.
# To run unreleased main, use docker-compose.yml, which builds from source.
services:
  understory:
    image: ghcr.io/reason-labs/understory:latest
    ports:
      # BIND_ADDRESS picks which host interface publishes the port (default: all).
      # Use 127.0.0.1 or your Tailscale IP to keep the memory off the wider network.
      - "${BIND_ADDRESS:-0.0.0.0}:3800:3800"
    # Lets the container reach a llama.cpp server running on the host via
    # http://host.docker.internal:8080/v1 (see "Local llama.cpp" in the README).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent OKF bundle. Swap for a bind mount (e.g. /srv/okf-bundle:/bundle)
      # if you want to edit the markdown from the host / sync it with git.
      - okf-bundle:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-}
      AUTH_TOKEN_READONLY: ${AUTH_TOKEN_READONLY:-}
      # Profiles (several isolated memories, one API key each): mount a volume
      # at /profiles and uncomment. See "Profiles" in the README.
      #PROFILES_ROOT: /profiles
      #ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Primary model
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      LLM_FALLBACK_RETRY_429: ${LLM_FALLBACK_RETRY_429:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-true}
      # Empty means "use the default" (see .env.example for each one).
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      MUTATION_ROLLBACK: ${MUTATION_ROLLBACK:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      QUERY_CACHE: ${QUERY_CACHE:-}
      QUERY_CACHE_TTL: ${QUERY_CACHE_TTL:-}
      HOT_MEMORY: ${HOT_MEMORY:-}
      HOT_MEMORY_TTL: ${HOT_MEMORY_TTL:-}
      # Dreaming spends tokens unattended, so it is opt-in: off unless
      # DREAM_INTERVAL (e.g. 6h) is set in the stack's environment.
      DREAM_INTERVAL: ${DREAM_INTERVAL:-}
      DREAM_SIGNALS: ${DREAM_SIGNALS:-}
      DREAM_INSIGHTS: ${DREAM_INSIGHTS:-}
      DREAM_MAX_CHANGES: ${DREAM_MAX_CHANGES:-}
      DREAM_VERIFY: ${DREAM_VERIFY:-}
      DREAM_MODE: ${DREAM_MODE:-}
    restart: unless-stopped

volumes:
  okf-bundle:
